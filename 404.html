<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection...</title>
    <meta http-equiv="refresh" content="0; url=https://killian-dev-fr.github.io/portfolio">
</head>
<body>
    <p>Le site a changé d'adresse. Vous allez être redirigé vers le nouveau site...</p>
    
    <script>
        var nouveauDomaine = "https://killian-dev-fr.github.io";
        
        var nouvelleUrl = nouveauDomaine + window.location.pathname + window.location.search;
        window.location.replace(nouvelleUrl);
    </script>
</body>
</html>
